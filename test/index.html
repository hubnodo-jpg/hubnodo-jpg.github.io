<style>
  /* Pagina d'ingresso: dà a NODO icona, nome e indirizzo propri e apre l'app Google a tutto schermo */
  :root { --night: #243237; --champ: #c9ad8b; --paper: #fafaf7 }
  /* iPhone, app aperta dall'icona: iOS lascia in fondo una fascia dove la pagina non può disegnare, si vede solo
     il colore di fondo. Lo coloriamo come la barra di navigazione di NODO, così la fascia ne diventa la continuazione. */
  html { background: #ffffff }
  @media (prefers-color-scheme: dark) { html { background: #1b2529 } }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body { background: var(--night) }
  #frame { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: var(--night) }
  #app { display: block; width: 100%; height: 100%; border: 0; background: var(--night) }
  .splash { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; background: var(--night); color: var(--paper);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .35s }
  .splash.via { opacity: 0; pointer-events: none }
  /* niente logo fisso: il logo animato parte dentro l'app appena è pronta */
  .splash > div { display: grid; justify-items: center; gap: 18px; text-align: center; padding: 16px }
  .splash a { color: var(--champ); font-size: 14px }
  @media (prefers-reduced-motion: reduce) { .splash { transition: none } }
  /* invito alle notifiche: lo mostra questa pagina perché su iPhone il permesso si chiede solo da un tocco qui */
  .invito { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 3; max-width: 460px; margin: 0 auto;
    background: var(--paper); color: #1d282c; border-radius: 16px; padding: 16px; box-shadow: 0 10px 40px rgba(10, 16, 18, .35);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; gap: 12px }
  .invito[hidden] { display: none }
  .invito b { font-size: 17px }
  .invito p { margin: 0; color: #4a5458 }
  .invito .bt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
  .invito button { min-height: 46px; border-radius: 10px; border: 1px solid #c9cfd0; background: #fff; color: #1d282c; font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer }
  .invito button.si { background: var(--night); border-color: var(--night); color: var(--paper) }
  .test { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 2px); left: 50%; transform: translateX(-50%); pointer-events: none;
    background: #e87a20; color: #fff; font: 700 11px/1 system-ui, -apple-system, sans-serif; letter-spacing: .12em; padding: 3px 8px; border-radius: 0 0 6px 6px }
</style>

<body>
<div class="splash" id="splash" role="status" aria-label="Apertura di NODO">
  <div>
    <a id="direct" href="#" hidden>Non si apre? Tocca qui per aprire NODO</a>
  </div>
</div>
<div class="test" aria-hidden="true">TEST</div>
<div id="frame"><iframe id="app" title="NODO" allow="clipboard-write"></iframe></div>
<div class="invito" id="invito" role="dialog" aria-labelledby="invTit" hidden>
  <b id="invTit">Notifiche di NODO</b>
  <p>Ti avvisiamo quando c'è un lavoro nuovo o cambiato, una richiesta da confermare o un problema segnalato.</p>
  <div class="bt"><button type="button" id="invNo">Non ora</button><button type="button" class="si" id="invSi">Attiva</button></div>
</div>
<script>
  // Indirizzo della web app Google Apps Script (Esegui il deployment → Gestisci deployment → URL)
  var APP_URL = "https://script.google.com/macros/s/AKfycbxM-9nYEvalIwLsQAkItjPQAcn0SfAD2e8peb0YLV21wC4Ny5aTk8G_hTh5WCrIdeKF/exec";
  var app = document.getElementById("app"), splash = document.getElementById("splash"), direct = document.getElementById("direct");
  direct.href = APP_URL;
  // l'app manda "nodo-pronto" quando è caricata; solo allora togliamo la schermata d'apertura
  window.addEventListener("message", function (e) { if (e.data === "nodo-pronto") splash.classList.add("via"); });
  // aperta dall'icona su iPhone: l'app non aggiunge il margine per la barretta, che finisce già nella fascia sotto
  app.src = APP_URL + (window.navigator.standalone ? "?da=home" : "");
  // Se Google non permette di mostrare l'app qui dentro, resta il collegamento diretto
  setTimeout(function () { direct.hidden = false; }, 8000);
</script>
<script type="module">
  // Notifiche sul telefono con Firebase Cloud Messaging. Valori pubblici del progetto Firebase «NODO»
  // (Impostazioni progetto › Generali › La tua app web) e chiave dei certificati push web (Cloud Messaging).
  const FIREBASE = { apiKey: "AIzaSyAeZY8ihPbIwDQ9ZsTAeD-x9VibsWNASS8", authDomain: "nodo-9d50c.firebaseapp.com", projectId: "nodo-9d50c", storageBucket: "nodo-9d50c.firebasestorage.app", messagingSenderId: "792290982149", appId: "1:792290982149:web:35bf8804d2257779e3df6c" };
  const VAPID = "BAshzNoHtF5wmdKHSEekVg8jtm4qLPzJ1momctC3bdEwJdRiP_k3KMTVWU2BADbzZpK3hlEPyggXq8gkTpJoSfM";
  const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";
  const invito = document.getElementById("invito");
  let sorgente = null, origine = "", base = null;
  // l'app NODO (dentro la cornice Google) chiede lo stato delle notifiche; rispondiamo solo a lei
  const rispondi = (m) => { try { if (sorgente) sorgente.postMessage(m, origine); } catch (e) {} };
  const supportato = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const dispositivo = () => (/iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Computer")
    + (navigator.standalone || matchMedia("(display-mode: standalone)").matches ? " · icona" : " · browser");
  function prepara() {
    base = base || (async () => {
      const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
      await navigator.serviceWorker.ready;
      const [fa, fm] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-messaging.js")]);
      const msg = fm.getMessaging(fa.initializeApp(FIREBASE));
      // con NODO aperto l'avviso arriva qui e non al service worker: lo mostriamo lo stesso
      fm.onMessage(msg, (p) => { const n = p.notification || {}; reg.showNotification(n.title || "NODO", { body: n.body || "", icon: "icons/icon-192.png" }); });
      return { reg, msg, getToken: fm.getToken };
    })();
    return base;
  }
  async function invia() {
    try {
      const b = await prepara();
      const t = await b.getToken(b.msg, { vapidKey: VAPID, serviceWorkerRegistration: b.reg });
      rispondi(t ? { nodo: "token", token: t, disp: dispositivo() } : { nodo: "stato", stato: "errore" });
    } catch (e) { base = null; rispondi({ nodo: "stato", stato: "errore" }); }
  }
  function controlla(chiesto) {
    if (!FIREBASE.apiKey || !VAPID) return rispondi({ nodo: "stato", stato: "spente" });
    if (!supportato()) return rispondi({ nodo: "stato", stato: "non-supportato" });
    if (Notification.permission === "denied") return rispondi({ nodo: "stato", stato: "negato" });
    if (Notification.permission === "granted") return invia();
    rispondi({ nodo: "stato", stato: "da-attivare" });
    prepara().catch(() => { base = null; });
    let no = 0;
    try { no = Number(localStorage.getItem("nodo-notifiche-no") || 0); } catch (e) {}
    if (chiesto || Date.now() - no > 3 * 864e5) invito.hidden = false;
  }
  window.addEventListener("message", (e) => {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !e.data || typeof e.data !== "object") return;
    sorgente = e.source; origine = e.origin;
    // colore del bordo inferiore di NODO: lo diamo alla fascia che iOS lascia sotto l'app aperta dall'icona
    if (e.data.nodo === "fondo" && /^rgba?\([\d\s.,%]+\)$/.test(String(e.data.colore))) document.documentElement.style.backgroundColor = e.data.colore;
    // nuova versione di NODO pubblicata: ricarichiamo l'app dentro la pagina, con la schermata d'apertura
    if (e.data.nodo === "ricarica") {
      splash.classList.remove("via");
      app.src = APP_URL + (window.navigator.standalone ? "?da=home&" : "?") + "r=" + Date.now();
    }
  });
  document.getElementById("invSi").addEventListener("click", async () => {
    invito.hidden = true;
    // il permesso va chiesto subito, dentro il tocco: iPhone non accetta richieste fatte dopo
    const p = await Notification.requestPermission();
    if (p === "granted") invia(); else rispondi({ nodo: "stato", stato: p === "denied" ? "negato" : "da-attivare" });
  });
  document.getElementById("invNo").addEventListener("click", () => {
    invito.hidden = true;
    try { localStorage.setItem("nodo-notifiche-no", String(Date.now())); } catch (e) {}
  });
</script>
<noscript><p style="color:#fafaf7; text-align:center"><a style="color:#c9ad8b" href="https://script.google.com/macros/s/AKfycbxM-9nYEvalIwLsQAkItjPQAcn0SfAD2e8peb0YLV21wC4Ny5aTk8G_hTh5WCrIdeKF/exec">Apri NODO</a></p></noscript>
<!-- ===== Ascolto per «Parla e compila» =====
  NODO gira dentro il riquadro di Google, che non può usare il microfono. Questa pagina d'ingresso sì: quando NODO chiede
  di ascoltare, apre questo pannello, ascolta, e rimanda a NODO solo il testo capito (non lo mostra da nessuna parte).
  Se NODO ha una domanda, la legge prima a voce (la voce femminile italiana più naturale del telefono) e poi ascolta la risposta. -->
<style>
  .asc { position: fixed; inset: 0; z-index: 5; display: grid; align-items: end; background: rgba(10, 16, 18, .55);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif }
  .asc[hidden] { display: none }
  .asc-box { background: #fafaf7; color: #1d282c; border-radius: 22px 22px 0 0; padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    display: grid; justify-items: center; gap: 14px; text-align: center; max-width: 520px; width: 100%; margin: 0 auto }
  .asc-dom { margin: 0; font-size: 17px; font-weight: 600; max-width: 34ch }
  .asc-dom:empty { display: none }
  .asc-mic { width: 104px; height: 104px; border-radius: 50%; border: 0; background: #243237; color: #fafaf7; display: grid; place-items: center; position: relative; cursor: pointer }
  .asc-mic svg { width: 40px; height: 40px }
  .asc-mic.on { background: #c2412f }
  .asc-mic.on::before, .asc-mic.on::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid #c2412f; opacity: 0; animation: asc-onda 1.6s ease-out infinite }
  .asc-mic.on::after { animation-delay: .8s }
  .asc-mic.sente::before, .asc-mic.sente::after { animation-duration: .9s }
  @keyframes asc-onda { 0% { transform: scale(.85); opacity: .55 } 100% { transform: scale(1.35); opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .asc-mic.on::before, .asc-mic.on::after { animation: none; opacity: .5 } }
  .asc-stato { margin: 0; color: #4a5458; font-size: 15px; min-height: 21px }
  .asc-bt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100% }
  .asc-bt button { min-height: 48px; border-radius: 12px; border: 1px solid #c9cfd0; background: #fff; color: #1d282c; font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer }
  .asc-bt .si { background: #243237; border-color: #243237; color: #fafaf7 }
</style>
<div class="asc" id="asc" role="dialog" aria-modal="true" aria-labelledby="ascStato" hidden>
  <div class="asc-box">
    <p class="asc-dom" id="ascDom"></p>
    <button type="button" class="asc-mic" id="ascMic" aria-label="Parla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></button>
    <p class="asc-stato" id="ascStato" role="status" aria-live="polite">Tocca e parla</p>
    <div class="asc-bt"><button type="button" id="ascNo">Annulla</button><button type="button" class="si" id="ascFine">Ho finito</button></div>
  </div>
</div>
<script>
  (function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var pan = document.getElementById("asc"), mic = document.getElementById("ascMic"), stato = document.getElementById("ascStato"), dom = document.getElementById("ascDom");
    var sorg = null, orig = "", richiesta = 0, rec = null, sentito = "", errore = "", tSil = null, tMax = null, tNiente = null, daTocco = false, toccoRec = false, sbloccata = false, tPronto = null;
    // iPhone/iPad: il microfono parte solo da un tocco su questa pagina, mai da solo
    var iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var manda = function (m) { try { if (sorg) sorg.postMessage(m, orig); } catch (e) {} };

    // voce: la femminile italiana più naturale che il telefono ha (Premium, Avanzata, Natural…); scarta maschili e voci giocattolo
    var voce = null;
    function punti(v) {
      var n = v.name + " " + (v.voiceURI || ""), p = 0;
      if (/\b(luca|diego|cosimo|giuseppe|benigno|roberto|marco|giorgio|calogero|lorenzo|rinaldo)\b|male\b|maschil/i.test(v.name) && !/female|femmin/i.test(n)) p -= 100;
      if (/alice|federica|paola|elsa|isabella|emma|bianca|carla|giulia|chiara|silvia|francesca|martina|elena|google italiano|female|femmin/i.test(n)) p += 20;
      if (/natural|neural|online/i.test(n)) p += 45;
      if (/premium/i.test(n)) p += 40;
      if (/enhanced|avanzat|migliorat/i.test(n)) p += 30;
      if (/google/i.test(n)) p += 15;
      if (/eddy|\bflo\b|grandma|grandpa|nonna|nonno|reed|rocko|sandy|shelley|espeak|compact/i.test(n)) p -= 60;
      return p;
    }
    function scegliVoce() {
      try { var l = speechSynthesis.getVoices().filter(function (v) { return /^it/i.test(v.lang); }); l.sort(function (a, b) { return punti(b) - punti(a); }); voce = l[0] || null; } catch (e) {}
    }
    if (window.speechSynthesis) { scegliVoce(); try { speechSynthesis.addEventListener("voiceschanged", scegliVoce); } catch (e) {} }
    function parla(t, poi) {
      try {
        if (!window.speechSynthesis || !t) { if (poi) poi(); return; }
        speechSynthesis.cancel();
        var frasi = String(t).match(/[^.!?]+[.!?]*/g) || [t];
        var fatto = false, partita = false, avanti = function () { if (!fatto) { fatto = true; if (poi) setTimeout(poi, 300); } };
        frasi.forEach(function (f, i) {
          var u = new SpeechSynthesisUtterance(f.trim()); u.lang = voce ? voce.lang : "it-IT"; if (voce) u.voice = voce; u.rate = 1.02;
          u.onstart = function () { partita = true; };
          if (i === frasi.length - 1) u.onend = u.onerror = avanti;
          speechSynthesis.speak(u);
        });
        // iPhone non parla finché non si è toccata questa pagina: in quel caso non restiamo fermi ad aspettare
        if (poi) setTimeout(function () { if (!partita && !fatto) { try { speechSynthesis.cancel(); } catch (e) {} avanti(); } }, 2500);
      } catch (e) { if (poi) poi(); }
    }

    function chiudi(m) {
      clearTimeout(tSil); clearTimeout(tMax); clearTimeout(tNiente); clearTimeout(tPronto);
      var r = rec; rec = null; if (r) { try { r.abort(); } catch (e) {} }
      mic.classList.remove("on", "sente"); pan.hidden = true;
      if (m) manda(m);
    }
    function ascolta() {
      if (rec) { ferma(); return; }
      if (!SR) { chiudi({ nodo: "sentito", id: richiesta, errore: "non-supportato" }); return; }
      try { if (speechSynthesis.speaking) speechSynthesis.cancel(); } catch (e) {}
      sentito = ""; errore = "";
      var r = rec = new SR(); r.lang = "it-IT"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
      r.onresult = function (e) {
        if (rec !== r) return;
        var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + " ";
        sentito = t.replace(/\s+/g, " ").trim(); mic.classList.add("sente"); clearTimeout(tNiente);
        clearTimeout(tSil); tSil = setTimeout(ferma, 2500);           // una pausa di 2,5 s dopo aver parlato = «ho finito»
      };
      r.onerror = function (e) { if (rec === r) errore = e.error || "errore"; };
      r.onstart = r.onaudiostart = function () { clearTimeout(tPronto); };
      r.onend = function () { if (rec === r) finito(); };
      toccoRec = daTocco; daTocco = false;
      try { r.start(); } catch (e) { rec = null; mic.classList.remove("on"); stato.textContent = "Tocca il microfono e parla"; return; }
      mic.classList.add("on"); stato.textContent = "Ti ascolto…";
      clearTimeout(tPronto);
      tPronto = setTimeout(function () {
        if (rec !== r) return;
        rec = null; try { r.abort(); } catch (e) {}
        clearTimeout(tSil); clearTimeout(tMax); clearTimeout(tNiente);
        mic.classList.remove("on", "sente");
        stato.textContent = toccoRec ? "Il microfono non risponde: tocca Annulla e scrivi il lavoro" : "Tocca il microfono e parla";
      }, 3000);
      tNiente = setTimeout(ferma, 9000); tMax = setTimeout(ferma, 90000);
    }
    // iPhone spesso non chiude l'ascolto quando glielo si chiede: dopo 0,7 s chiudiamo noi con quello che abbiamo sentito
    function ferma() {
      clearTimeout(tSil); clearTimeout(tMax); clearTimeout(tNiente);
      var r = rec; if (!r) return;
      stato.textContent = "Un attimo…";
      try { r.stop(); } catch (e) {}
      setTimeout(function () { if (rec === r) finito(); }, 700);
    }
    function finito() {
      var t = sentito.trim(), err = errore;
      if (t) { chiudi({ nodo: "sentito", id: richiesta, testo: t }); return; }
      clearTimeout(tSil); clearTimeout(tMax); clearTimeout(tNiente);
      clearTimeout(tPronto);
      var r = rec; rec = null; if (r) { try { r.abort(); } catch (e) {} }
      mic.classList.remove("on", "sente");
      if ((err === "not-allowed" || err === "service-not-allowed") && !toccoRec) { stato.textContent = "Tocca il microfono e parla"; return; }
      if (err === "not-allowed" || err === "service-not-allowed") {
        // permesso negato: lo diciamo a NODO, che passa allo scrivere
        chiudi({ nodo: "sentito", id: richiesta, errore: err });
        return;
      }
      stato.textContent = "Non ho sentito niente: tocca il microfono e parla";
    }

    mic.addEventListener("click", function () {
      if (!sbloccata && window.speechSynthesis) { try { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); sbloccata = true; } catch (e) {} }
      if (!rec) daTocco = true;
      ascolta();
    });
    document.getElementById("ascFine").addEventListener("click", function () { if (rec) ferma(); else chiudi({ nodo: "sentito", id: richiesta, annullato: true }); });
    pan.addEventListener("click", function (e) { if (e.target === pan) chiudi({ nodo: "sentito", id: richiesta, annullato: true }); });
    document.getElementById("ascNo").addEventListener("click", function () { chiudi({ nodo: "sentito", id: richiesta, annullato: true }); });

    window.addEventListener("message", function (e) {
      if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !e.data || typeof e.data !== "object") return;
      var d = e.data;
      if (d.nodo === "ascolto?") { sorg = e.source; orig = e.origin; manda({ nodo: "ascolto", ok: !!SR }); return; }
      if (d.nodo === "parla") { parla(String(d.testo || "").slice(0, 400)); return; }
      if (d.nodo !== "ascolta") return;
      sorg = e.source; orig = e.origin; richiesta = Number(d.id) || 0;
      dom.textContent = String(d.domanda || "").slice(0, 400); stato.textContent = "Tocca e parla"; pan.hidden = false;
      // con una domanda: prima la legge, poi ascolta; senza: ascolta subito (il tocco in NODO di solito basta per il permesso)
      if (iOS) { if (d.domanda) parla(String(d.domanda).slice(0, 400)); stato.textContent = "Tocca il microfono e parla"; return; }
      if (d.domanda) parla(String(d.domanda).slice(0, 400), ascolta); else ascolta();
    });
  })();
</script>
<!-- ===== fine ascolto ===== -->
</body>
