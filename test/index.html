  const supportato = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const dispositivo = () => (/iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Computer")
    + (navigator.standalone || matchMedia("(display-mode: standalone)").matches ? " · icona" : " · browser");
  function prepara() {
    base = base || (async () => {
      const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
      await navigator.serviceWorker.ready;
      const [fa, fm] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-messaging.js")]);
      const msg = fm.getMessaging(fa.initializeApp(FIREBASE));
      // con NODO aperto l'avviso arriva qui e non al service worker: lo mostriamo lo stesso
      fm.onMessage(msg, (p) => { const n = p.notification || {}; reg.showNotification(n.title || "NODO", { body: n.body || "", icon: "icons/icon-192.png" }); });
      return { reg, msg, getToken: fm.getToken };

  }

    try {
      const b = await prepara();

  }

    if (!supportato()) return rispondi({ nodo: "stato", stato: "non-supportato" });
    if (Notification.permission === "denied") return rispondi({ nodo: "stato", stato: "negato" });
    if (Notification.permission === "granted") return invia();
    rispondi({ nodo: "stato", stato: "da-attivare" });
    prepara().catch(() => { base = null; });
    let no = 0;
    try { no = Number(localStorage.getItem("nodo-notifiche-no") || 0); } catch (e) {}

  }

    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !e.data || typeof e.data !== "object") return;

      // NODO non ce l'ha fatta (AI non raggiungibile, accesso scaduto…): lo diciamo e lasciamo riprovare o scrivere
      if (d.nodo === "lumi-errore") {
        if (pan.hidden) return;
        fineConv(); chiesto = false;
        var msg = String(d.testo || "").slice(0, 200);
        dopoAttesa(function () {
          dom.textContent = "Non ci sono riuscita."; tu.textContent = ""; det.textContent = "";
          aspetto("fermo", msg + " Tocca il cerchio per riprovare.");
          parla("Non ci sono riuscita.", null, voci.errore && voci.errore.audio);
        });
        return;
      }
      // NODO dice una frase (vecchio «Parla e compila»): se la pagina è aperta la chiude dopo averla detta
      if (d.nodo === "parla") {
        var t = String(d.testo || "").slice(0, 400);
        if (pan.hidden) { parla(t, null, vocePer(t)); return; }
        fineConv(); chiesto = false;
        dice(t, "", function () { chiudi(); }, vocePer(t), function () { aspetto("fermo", ""); });
        return;
      }
      if (d.nodo !== "ascolta") return;
      sorg = e.source; orig = e.origin; richiesta = Number(d.id) || 0; chiesto = true;
      var domanda = String(d.domanda || "").slice(0, 400);
      clearTimeout(tAttesa);
      pan.hidden = false; btn.hidden = true;
      // la domanda del modulo: con la voce di Lumi se c'è, altrimenti solo scritta (mai un'altra voce)
      var dopo;
      if (conv && rec) { muto = true; dice(domanda || "Dimmi.", "", inAscolto, vocePer(domanda), inAscolto); return; }
      if (scrivendo) { dopo = function () { aspetto("fermo", ""); }; dice(domanda, "", dopo, vocePer(domanda), dopo); return; }
      dopo = function () { if (iOS) aspetto("fermo", "Tocca il cerchio e rispondi"); else accendi(false); };
      dice(domanda || "Dimmi.", "", dopo, vocePer(domanda), dopo);
    });
  })();
</script>
